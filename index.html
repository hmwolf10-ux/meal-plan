<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Plan</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header>
    <h1>Meal Plan &amp; Recipes</h1>
    <p>Budget-first, batch-friendly system</p>
  </header>

  <nav class="nav" aria-label="Primary navigation">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="recipes">Recipes</button>
    <button class="tab-btn" data-tab="plan">Meal Plan</button>
    <button class="tab-btn" data-tab="shopping">Shopping</button>
  </nav>

  <main class="container">
    <p id="app-error" class="error" role="alert" hidden></p>
    <section class="content active" id="overview" aria-labelledby="overview-title">
      <h2 id="overview-title" class="visually-hidden">Overview</h2>
      <div id="overview-content"></div>
    </section>
    <section class="content" id="recipes" aria-labelledby="recipes-title">
      <h2 id="recipes-title" class="visually-hidden">Recipes</h2>
      <div id="recipe-filters" class="filters" aria-label="Recipe filters"></div>
      <div id="recipes-table"></div>
      <div id="recipe-detail"></div>
    </section>
    <section class="content" id="plan" aria-labelledby="plan-title">
      <h2 id="plan-title" class="visually-hidden">Meal Plan</h2>
      <div id="plan-content"></div>
    </section>
    <section class="content" id="shopping" aria-labelledby="shopping-title">
      <h2 id="shopping-title" class="visually-hidden">Shopping List</h2>
      <div id="shopping-content"></div>
    </section>
  </main>

  <footer>Budget-first, batch-friendly, high-protein.</footer>
  <script type="module" src="src/app.js"></script>
</body>
</html>
